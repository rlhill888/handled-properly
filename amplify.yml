version: 1
applications:
  - appRoot: handled-properly-dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
            - |
              case "$AWS_BRANCH" in
                main) SECRET_ID="prod/handled-properly-dashboard" ;;
                test) SECRET_ID="test/handled-properly-dashboard" ;;
                *) echo "No secret mapping for branch '$AWS_BRANCH' - skipping" ; SECRET_ID="" ;;
              esac
            - |
              if [ -n "$SECRET_ID" ]; then
                aws secretsmanager get-secret-value \
                  --secret-id "$SECRET_ID" \
                  --region us-east-1 \
                  --query SecretString \
                  --output text \
                | node -e '
                    const body = require("fs").readFileSync(0, "utf8");
                    const vars = JSON.parse(body);
                    const lines = Object.entries(vars).map(([k, v]) => k + "=" + JSON.stringify(String(v)));
                    require("fs").writeFileSync(".env.production", lines.join("\n") + "\n");
                  '
              fi
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - .npm/**/*
